<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa Europa - Mapbox Custom Style</title>
  
  <!-- Mapbox GL JS CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  
  <!-- PapaParse per leggere il CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Font Google Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #e5e7eb; }
    #map { width: 100vw; height: 100vh; }

    /* Custom Styling dei Popup Mapbox */
    .mapboxgl-popup {
      max-width: 260px !important;
    }
    .mapboxgl-popup-content {
      padding: 0 !important;
      border-radius: 16px !important;
      background: #ffffff !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2) !important;
      overflow: hidden;
    }
    .mapboxgl-popup-close-button {
      color: #374151 !important;
      font-size: 18px !important;
      padding: 6px 10px 0 0 !important;
      z-index: 10;
      outline: none;
    }

    .popup-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .popup-img-wrapper {
      width: 100%;
      height: 130px;
      background-color: #e5e7eb;
      position: relative;
      overflow: hidden;
    }
    .popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-body {
      padding: 14px 16px;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }
    .popup-location {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
    }

    /* Pin Custom */
    .marker-pin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .marker-pin:hover {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. Inserisci il tuo Access Token Mapbox
  mapboxgl.accessToken = 'pk.eyJ1IjoiYzNldXJvcGUiLCJhIjoiY210c2tyZ2poMDAxbzJ5czY5dGs3eTV5dCJ9.Uk7aRGqXFeka71nMjQHwzA';

  const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSzVWcvI8VEYjn53K4V2Y4gWoNZnP6vjFxKOHZo0e7s4o7gZZrePoDQnAL3cZB-0TnBuSo8b_xu1LC/pub?output=csv';
  const DEFAULT_IMAGE = 'https://images.pexels.com/photos/46160/field-clouds-sky-earth-46160.jpeg?auto=compress&cs=tinysrgb&w=800';

  // 2. Inizializza la mappa applicando lo stile di Mapbox Studio
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11', // Il tuo stile personalizzato
    center: [15.0, 50.0], // [Longitudine, Latitudine]
    zoom: 4
  });

  // Aggiunge i controlli di zoom in alto a destra
  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  // 3. Lettura dei dati dal CSV Google Sheets
  Papa.parse(googleSheetCsvUrl, {
    download: true,
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];

        const locationName = row[1] ? row[1].trim() : '';
        const colC = row[2] ? row[2].trim() : '';
        const colD = row[3] ? row[3].trim() : '';
        const colE = row[4] ? row[4].trim() : '';
        
        const city = row[5] ? row[5].trim() : '';
        const country = row[8] ? row[8].trim() : '';
        const imageUrl = row[11] ? row[11].trim() : DEFAULT_IMAGE; // Colonna L gestita da Apps Script

        const rawLat = row[6] ? row[6].toString().replace(',', '.') : '';
        const rawLng = row[7] ? row[7].toString().replace(',', '.') : '';
        
        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);

        if (!isNaN(lat) && !isNaN(lng)) {
          // Determina il colore del pin in base alle colonne C, D, E
          const pinColor = (colC && colC.toUpperCase() === 'Y') ? '#2563eb' :
                           (colD && colD.toUpperCase() === 'Y') ? '#d97706' :
                           (colE && colE.toUpperCase() === 'Y') ? '#059669' : '#4b5563';

          // Crea elemento DOM per il marker
          const el = document.createElement('div');
          el.className = 'marker-pin';
          el.style.backgroundColor = pinColor;

          // HTML del Popup
          let popupContent = `<div class="popup-card">
            <div class="popup-img-wrapper">
              <img src="${imageUrl}" alt="${city || country}" class="popup-img" onerror="this.onerror=null;this.src='${DEFAULT_IMAGE}';" />
            </div>
            <div class="popup-body">`;
          
          if (locationName) {
            popupContent += `<div class="popup-title">${locationName}</div>`;
          }
          if (city || country) {
            popupContent += `<div class="popup-location">📍 ${city}${city && country ? ', ' : ''}${country}</div>`;
          }
          popupContent += '</div></div>';

          const popup = new mapboxgl.Popup({ offset: 12 }).setHTML(popupContent);

          // In Mapbox le coordinate sono ordinate come [Longitudine, Latitudine]
          new mapboxgl.Marker(el)
            .setLngLat([lng, lat])
            .setPopup(popup)
            .addTo(map);
        }
      }
    }
  });
</script>

</body>
</html>
