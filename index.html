<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa Europa - Dark Mode</title>
  
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Font Google Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #09090b; }
    #map { width: 100vw; height: 100vh; }

    /* Personalizzazione Popup per Tema Scuro */
    .mapboxgl-popup-content {
      padding: 0 !important;
      border-radius: 16px !important;
      max-width: 260px !important;
      background: #18181b !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #18181b !important; }
    .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #18181b !important; }
    .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #18181b !important; }
    .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #18181b !important; }
    
    .mapboxgl-popup-close-button {
      color: #ffffff;
      font-size: 18px;
      padding: 6px 10px;
      z-index: 2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      background-color: transparent;
      border: none;
    }

    .popup-card {
      display: flex;
      flex-direction: column;
      background: #18181b;
    }
    .popup-img-wrapper {
      width: 100%;
      height: 130px;
      background-color: #27272a;
    }
    .popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .popup-body {
      padding: 14px 16px;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }
    .popup-location {
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
    }

    .custom-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .custom-marker:hover {
      transform: scale(1.4);
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYzNldXJvcGUiLCJhIjoiY210c2x6c3M4MDBmYjJ5c2hkbGk3MTJsNSJ9.r-mcV9eA6pvHoK1-Hqr-3A';

  const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSzVWcvI8VEYjn53K4V2Y4gWoNZnP6vjFxKOHZo0e7s4o7gZZrePoDQnAL3cZB-0TnBuSo8b_xu1LC/pub?output=csv';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [15.0, 50.0],
    zoom: 3.8
  });

  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

  function getMarkerColor(colC, colD, colE) {
    if (colC && colC.trim().toUpperCase() === 'Y') return '#3b82f6'; // Blu
    if (colD && colD.trim().toUpperCase() === 'Y') return '#eab308'; // Giallo
    if (colE && colE.trim().toUpperCase() === 'Y') return '#10b981'; // Verde
    return '#6b7280'; // Grigio
  }

  map.on('load', () => {
    map.resize();

    Papa.parse(googleSheetCsvUrl, {
      download: true,
      header: false,
      skipEmptyLines: true,
      complete: function(results) {
        const rows = results.data;

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];

          const locationName = row[1] ? row[1].trim() : '';
          const colC = row[2] ? row[2].trim() : '';
          const colD = row[3] ? row[3].trim() : '';
          const colE = row[4] ? row[4].trim() : '';
          const city = row[5] ? row[5].trim() : '';
          
          const rawLat = row[6] ? row[6].toString().replace(',', '.') : '';
          const rawLng = row[7] ? row[7].toString().replace(',', '.') : '';
          
          const lat = parseFloat(rawLat);
          const lng = parseFloat(rawLng);
          
          const country = row[8] ? row[8].trim() : '';
          let imgUrl = row[11] ? row[11].trim() : '';

          if (!imgUrl || !imgUrl.startsWith('http')) {
            imgUrl = 'https://images.unsplash.com/photo-1477959858617-67f30ac4ce71?w=600';
          }

          if (!isNaN(lat) && !isNaN(lng)) {
            const pinColor = getMarkerColor(colC, colD, colE);

            const el = document.createElement('div');
            el.className = 'custom-marker';
            el.style.backgroundColor = pinColor;

            let popupContent = `<div class="popup-card">
              <div class="popup-img-wrapper"><img src="${imgUrl}" alt="${city}" class="popup-img" /></div>
              <div class="popup-body">`;
            if (locationName) {
              popupContent += `<div class="popup-title">${locationName}</div>`;
            }
            if (city || country) {
              popupContent += `<div class="popup-location">📍 ${city}${city && country ? ', ' : ''}${country}</div>`;
            }
            popupContent += '</div></div>';

            const popup = new mapboxgl.Popup({ offset: 12, closeButton: true }).setHTML(popupContent);

            new mapboxgl.Marker(el)
              .setLngLat([lng, lat])
              .setPopup(popup)
              .addTo(map);
          }
        }
      }
    });
  });
</script>

</body>
</html>
