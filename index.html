<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>Mappa Europa - Dark Aesthetic</title>
  
  <!-- Mapbox GL JS CSS & JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" referrerpolicy="strict-origin-when-cross-origin" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js" referrerpolicy="strict-origin-when-cross-origin"></script>
  
  <!-- PapaParse per leggere il CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Font Google Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: 'Inter', sans-serif; 
      background-color: #0d1117; 
    }
    #map { width: 100vw; height: 100vh; }

    /* Custom Popup Mapbox - Dark Glassmorphism */
    .mapboxgl-popup {
      max-width: 260px !important;
    }
    .mapboxgl-popup-content {
      padding: 0 !important;
      border-radius: 16px !important;
      background: rgba(22, 27, 34, 0.95) !important;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      overflow: hidden;
      color: #f3f4f6;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Freccia del Popup ereditata dal container */
    .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: rgba(22, 27, 34, 0.95) !important; }
    .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: rgba(22, 27, 34, 0.95) !important; }
    .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: rgba(22, 27, 34, 0.95) !important; }
    .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: rgba(22, 27, 34, 0.95) !important; }

    .mapboxgl-popup-close-button {
      color: #9ca3af !important;
      font-size: 18px !important;
      padding: 6px 10px 0 0 !important;
      z-index: 10;
      outline: none;
    }
    .mapboxgl-popup-close-button:hover {
      color: #ffffff !important;
      background: transparent !important;
    }

    .popup-card {
      display: flex;
      flex-direction: column;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* VARIANTI COLORE PER I POPUP */
    /* Blue Theme (Ciano) */
    .popup-theme-blue {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
    }
    .popup-theme-blue .popup-location { color: #38bdf8; }
    .popup-theme-blue .popup-img-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Amber Theme (Giallo / Arancio) */
    .popup-theme-amber {
      border-color: rgba(251, 191, 36, 0.4);
      box-shadow: 0 8px 25px rgba(251, 191, 36, 0.15);
    }
    .popup-theme-amber .popup-location { color: #fbbf24; }
    .popup-theme-amber .popup-img-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Emerald Theme (Verde) */
    .popup-theme-emerald {
      border-color: rgba(52, 211, 153, 0.4);
      box-shadow: 0 8px 25px rgba(52, 211, 153, 0.15);
    }
    .popup-theme-emerald .popup-location { color: #34d399; }
    .popup-theme-emerald .popup-img-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Gray Theme (Grigio Slate) */
    .popup-theme-gray {
      border-color: rgba(156, 163, 175, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .popup-theme-gray .popup-location { color: #9ca3af; }

    /* Struttura interna Popup */
    .popup-img-wrapper {
      width: 100%;
      height: 130px;
      background-color: #1f2937;
      position: relative;
      overflow: hidden;
    }
    .popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-body {
      padding: 14px 16px;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #f9fafb;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }
    .popup-location {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* STRUTTURA MARKER */
    .custom-marker {
      width: 0;
      height: 0;
      position: relative;
    }
    .marker-inner {
      position: absolute;
      top: -12px;
      left: -12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .marker-glow {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      opacity: 0.35;
      filter: blur(4px);
      transition: all 0.3s ease;
      animation: pulseGlow 3s infinite ease-in-out;
      pointer-events: none;
    }
    .marker-core {
      position: relative;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
      pointer-events: none;
    }
    .marker-inner:hover .marker-core {
      transform: scale(1.4);
      border-color: #ffffff;
    }
    .marker-inner:hover .marker-glow {
      opacity: 0.75;
      transform: scale(1.5);
      filter: blur(6px);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.25); opacity: 0.6; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
(function() {
  mapboxgl.accessToken = 'pk.eyJ1IjoiYzNldXJvcGUiLCJhIjoiY210c2x6c3M4MDBmYjJ5c2hkbGk3MTJsNSJ9.r-mcV9eA6pvHoK1-Hqr-3A';

  const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSzVWcvI8VEYjn53K4V2Y4gWoNZnP6vjFxKOHZo0e7s4o7gZZrePoDQnAL3cZB-0TnBuSo8b_xu1LC/pub?output=csv';
  const DEFAULT_IMAGE = 'https://images.pexels.com/photos/46160/field-clouds-sky-earth-46160.jpeg?auto=compress&cs=tinysrgb&w=800';

  // Palette di colori con identificativo di classe CSS
  const PALETTE = {
    blue: { id: 'blue', core: '#38bdf8', glow: '#0284c7' },
    amber: { id: 'amber', core: '#fbbf24', glow: '#d97706' },
    emerald: { id: 'emerald', core: '#34d399', glow: '#059669' },
    gray: { id: 'gray', core: '#9ca3af', glow: '#4b5563' }
  };

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [15.0, 50.0],
    zoom: 4
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  Papa.parse(googleSheetCsvUrl, {
    download: true,
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];

        const locationName = row[1] ? row[1].trim() : '';
        const colC = row[2] ? row[2].trim() : '';
        const colD = row[3] ? row[3].trim() : '';
        const colE = row[4] ? row[4].trim() : '';
        
        const city = row[5] ? row[5].trim() : '';
        const country = row[8] ? row[8].trim() : '';
        const imageUrl = row[11] ? row[11].trim() : DEFAULT_IMAGE;

        const rawLat = row[6] ? row[6].toString().replace(',', '.') : '';
        const rawLng = row[7] ? row[7].toString().replace(',', '.') : '';
        
        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);

        if (!isNaN(lat) && !isNaN(lng)) {
          const colorTheme = (colC && colC.toUpperCase() === 'Y') ? PALETTE.blue :
                             (colD && colD.toUpperCase() === 'Y') ? PALETTE.amber :
                             (colE && colE.toUpperCase() === 'Y') ? PALETTE.emerald : PALETTE.gray;

          // Marker Elements
          const markerWrapper = document.createElement('div');
          markerWrapper.className = 'custom-marker';

          const markerInner = document.createElement('div');
          markerInner.className = 'marker-inner';

          const glowEl = document.createElement('div');
          glowEl.className = 'marker-glow';
          glowEl.style.backgroundColor = colorTheme.glow;

          const coreEl = document.createElement('div');
          coreEl.className = 'marker-core';
          coreEl.style.backgroundColor = colorTheme.core;

          markerInner.appendChild(glowEl);
          markerInner.appendChild(coreEl);
          markerWrapper.appendChild(markerInner);

          // HTML del Popup associato alla classe del colore del Pin
          let popupContent = `<div class="popup-card popup-theme-${colorTheme.id}">
            <div class="popup-img-wrapper">
              <img src="${imageUrl}" alt="${city || country}" class="popup-img" onerror="this.onerror=null;this.src='${DEFAULT_IMAGE}';" />
            </div>
            <div class="popup-body">`;
          
          if (locationName) {
            popupContent += `<div class="popup-title">${locationName}</div>`;
          }
          if (city || country) {
            popupContent += `<div class="popup-location">📍 ${city}${city && country ? ', ' : ''}${country}</div>`;
          }
          popupContent += '</div></div>';

          const popup = new mapboxgl.Popup({ offset: 14 }).setHTML(popupContent);

          new mapboxgl.Marker({ element: markerWrapper })
            .setLngLat([lng, lat])
            .setPopup(popup)
            .addTo(map);
        }
      }
    }
  });
})();
</script>

</body>
</html>
