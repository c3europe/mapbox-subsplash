<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa Europa - Foto Automatiche Client-Side</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Font Google Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #e5e7eb; }
    #map { width: 100vw; height: 100vh; }

    /* Popup Leaflet */
    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: 16px !important;
      max-width: 260px !important;
      background: #ffffff !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2) !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #374151 !important;
      font-size: 18px !important;
      padding: 6px 10px 0 0 !important;
      z-index: 10;
    }

    .popup-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .popup-img-wrapper {
      width: 100%;
      height: 130px;
      background-color: #f3f4f6;
      position: relative;
      overflow: hidden;
    }
    .popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }
    .popup-body {
      padding: 14px 16px;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }
    .popup-location {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
    }

    /* Pin Personalizzati */
    .custom-div-icon {
      background: transparent;
      border: none;
    }
    .marker-pin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .marker-pin:hover {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSzVWcvI8VEYjn53K4V2Y4gWoNZnP6vjFxKOHZo0e7s4o7gZZrePoDQnAL3cZB-0TnBuSo8b_xu1LC/pub?output=csv';

  // Inizializza mappa Leaflet
  const map = L.map('map', { zoomControl: false }).setView([50.0, 15.0], 4);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Cache locale per non ripetere chiamate per la stessa città
  const imageCache = {};

  // Funzione Client-Side per recuperare immagini reali da Flickr senza API Key e senza blocchi CORS
  function fetchCityImage(query, imgElementId) {
    if (imageCache[query]) {
      const el = document.getElementById(imgElementId);
      if (el) el.src = imageCache[query];
      return;
    }

    const callbackName = 'flickr_cb_' + Math.random().toString(36).substring(2, 9);
    
    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);

      let foundUrl = '';
      if (data && data.items && data.items.length > 0) {
        // Prende la prima immagine del feed
        foundUrl = data.items[0].media.m.replace('_m.', '_b.'); // versione grande HD
      } else {
        foundUrl = 'https://images.unsplash.com/photo-1477959858617-67f30ac4ce71?w=600';
      }

      imageCache[query] = foundUrl;
      const el = document.getElementById(imgElementId);
      if (el) el.src = foundUrl;
    };

    const script = document.createElement('script');
    script.src = `https://api.flickr.com/services/feeds/photos_public.gne?tags=${encodeURIComponent(query + ',city,landscape')}&tagmode=all&format=json&jsoncallback=${callbackName}`;
    document.body.appendChild(script);
  }

  // Caricamento dei dati dal CSV
  Papa.parse(googleSheetCsvUrl, {
    download: true,
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];

        const locationName = row[1] ? row[1].trim() : '';
        const colC = row[2] ? row[2].trim() : '';
        const colD = row[3] ? row[3].trim() : '';
        const colE = row[4] ? row[4].trim() : '';
        const city = row[5] ? row[5].trim() : '';
        
        const rawLat = row[6] ? row[6].toString().replace(',', '.') : '';
        const rawLng = row[7] ? row[7].toString().replace(',', '.') : '';
        
        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);
        
        const country = row[8] ? row[8].trim() : '';
        let rawImgVal = row[11] ? row[11].trim() : '';

        if (!isNaN(lat) && !isNaN(lng)) {
          const pinColor = (colC && colC.trim().toUpperCase() === 'Y') ? '#2563eb' :
                           (colD && colD.trim().toUpperCase() === 'Y') ? '#d97706' :
                           (colE && colE.trim().toUpperCase() === 'Y') ? '#059669' : '#4b5563';

          const customIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="marker-pin" style="background-color: ${pinColor};"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          const imgId = `popup-img-${i}`;
          
          let popupContent = `<div class="popup-card">
            <div class="popup-img-wrapper">
              <img id="${imgId}" src="https://images.unsplash.com/photo-1477959858617-67f30ac4ce71?w=600" alt="${city}" class="popup-img" />
            </div>
            <div class="popup-body">`;
          if (locationName) {
            popupContent += `<div class="popup-title">${locationName}</div>`;
          }
          if (city || country) {
            popupContent += `<div class="popup-location">📍 ${city}${city && country ? ', ' : ''}${country}</div>`;
          }
          popupContent += '</div></div>';

          const marker = L.marker([lat, lng], { icon: customIcon })
            .bindPopup(popupContent, { offset: [0, -5] })
            .addTo(map);

          // Quando l'utente apre il popup, se non c'è un link manuale, scarica la foto reale al volo
          marker.on('popupopen', () => {
            if (rawImgVal && rawImgVal.startsWith('http')) {
              document.getElementById(imgId).src = rawImgVal;
            } else {
              const searchQuery = city || locationName || country;
              if (searchQuery) {
                fetchCityImage(searchQuery, imgId);
              }
            }
          });
        }
      }
    }
  });
</script>

</body>
</html>
