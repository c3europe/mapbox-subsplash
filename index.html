<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa Europa - Foto Instantanee</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Font Google Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #e5e7eb; }
    #map { width: 100vw; height: 100vh; }

    /* Popup Leaflet */
    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: 16px !important;
      max-width: 260px !important;
      background: #ffffff !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2) !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #374151 !important;
      font-size: 18px !important;
      padding: 6px 10px 0 0 !important;
      z-index: 10;
    }

    .popup-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .popup-img-wrapper {
      width: 100%;
      height: 130px;
      background-color: #e5e7eb;
      position: relative;
      overflow: hidden;
    }
    .popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-body {
      padding: 14px 16px;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }
    .popup-location {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
    }

    /* Pin Personalizzati */
    .custom-div-icon {
      background: transparent;
      border: none;
    }
    .marker-pin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .marker-pin:hover {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSzVWcvI8VEYjn53K4V2Y4gWoNZnP6vjFxKOHZo0e7s4o7gZZrePoDQnAL3cZB-0TnBuSo8b_xu1LC/pub?output=csv';

  // Inizializza mappa Leaflet
  const map = L.map('map', { zoomControl: false }).setView([50.0, 15.0], 4);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Pulisce le stringhe per i tag di ricerca
  function cleanTag(str) {
    return str ? str.toLowerCase().replace(/[^a-z0-9]/g, '') : '';
  }

  // Genera un URL immagine dinamico basato su tag specifici
  function buildDirectImageUrl(city, country) {
    const cityTag = cleanTag(city);
    const countryTag = cleanTag(country);

    // Costruzione query con i tag trovati
    let tags = [];
    if (cityTag) tags.push(cityTag);
    if (countryTag) tags.push(countryTag);
    tags.push('city', 'architecture');

    const tagString = tags.join(',');
    
    // Genera l'URL diretto tramite LoremFlickr senza chiamate API intermedie
    return `https://loremflickr.com/600/400/${tagString}/all`;
  }

  // Caricamento del CSV
  Papa.parse(googleSheetCsvUrl, {
    download: true,
    header: false,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];

        const locationName = row[1] ? row[1].trim() : '';
        const colC = row[2] ? row[2].trim() : '';
        const colD = row[3] ? row[3].trim() : '';
        const colE = row[4] ? row[4].trim() : '';
        
        // Città (Colonna F -> Indice 5) e Nazione (Colonna I -> Indice 8)
        const city = row[5] ? row[5].trim() : '';
        const country = row[8] ? row[8].trim() : '';
        
        const rawLat = row[6] ? row[6].toString().replace(',', '.') : '';
        const rawLng = row[7] ? row[7].toString().replace(',', '.') : '';
        
        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);

        if (!isNaN(lat) && !isNaN(lng)) {
          const pinColor = (colC && colC.trim().toUpperCase() === 'Y') ? '#2563eb' :
                           (colD && colD.trim().toUpperCase() === 'Y') ? '#d97706' :
                           (colE && colE.trim().toUpperCase() === 'Y') ? '#059669' : '#4b5563';

          const customIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="marker-pin" style="background-color: ${pinColor};"></div>`,
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          // URL immagine istantaneo
          const imageUrl = buildDirectImageUrl(city, country);

          let popupContent = `<div class="popup-card">
            <div class="popup-img-wrapper">
              <img src="${imageUrl}" alt="${city}" class="popup-img" loading="eager" onerror="this.onerror=null;this.src='https://loremflickr.com/600/400/city';" />
            </div>
            <div class="popup-body">`;
          
          if (locationName) {
            popupContent += `<div class="popup-title">${locationName}</div>`;
          }
          if (city || country) {
            popupContent += `<div class="popup-location">📍 ${city}${city && country ? ', ' : ''}${country}</div>`;
          }
          popupContent += '</div></div>';

          L.marker([lat, lng], { icon: customIcon })
            .bindPopup(popupContent, { offset: [0, -5] })
            .addTo(map);
        }
      }
    }
  });
</script>

</body>
</html>
